[package]
name = "sextant_math"
version = "0.1.0"
edition = "2021"
authors = ["Rohit Purkait"]
license = "Apache-2.0"

[dependencies]
ink = { version = "6.0.0-beta.1", default-features = false }

[dev-dependencies]
ink_e2e = { version = "6.0.0-beta.1" }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = ["ink/std"]
ink-as-dependency = []
e2e-tests = []

[package.metadata.ink-lang]
abi = "sol"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false
